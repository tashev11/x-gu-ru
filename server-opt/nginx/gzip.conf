# Full gzip compression (augments `gzip on;` already set in nginx.conf).
# Big win for the ~50-90KB inline-CSS HTML pages and the 2.9MB sitemap.xml.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/rss+xml
    application/atom+xml
    application/ld+json
    image/svg+xml;
