server {
    server_name x-gu.ru;

    root /var/www/x-gu.ru/current;
    index index.html;

    # Baseline browser hardening. CSP is intentionally handled separately
    # because the site currently uses Yandex.Metrika, Google Fonts and chat JS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Lead form is public, so keep it narrowly rate-limited and small.
    location = /api/v1/leads/submit {
        client_max_body_size 64k;
        limit_req zone=lead_submit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:9000/api/v1/leads/submit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The backend MUST enforce authentication/authorization for /console.
    # If it does not, restrict this location by VPN/IP before deployment.
    location ^~ /console {
        proxy_pass http://127.0.0.1:9000/console;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long cache for immutable static assets.
    # Nginx does not inherit parent add_header directives when a child location
    # defines its own, so repeat the complete hardening set here.
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/x-gu.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/x-gu.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Canonical host is the bare domain. Never serve duplicate content from www.
server {
    listen [::]:443 ssl;
    listen 443 ssl;
    http2 on;
    server_name www.x-gu.ru;

    ssl_certificate /etc/letsencrypt/live/x-gu.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/x-gu.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://x-gu.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name x-gu.ru www.x-gu.ru;
    return 301 https://x-gu.ru$request_uri;
}
