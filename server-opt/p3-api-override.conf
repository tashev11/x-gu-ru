[Service]
# Avoid tight restart loops
RestartSec=3
# Memory containment on a 456MB box: if uvicorn balloons, throttle/swap to
# zram at 220M, hard-cap at 320M so the cgroup OOM-killer takes uvicorn
# (then Restart=always revives it) instead of the kernel killing nginx/sshd.
MemoryAccounting=yes
MemoryHigh=220M
MemoryMax=320M
